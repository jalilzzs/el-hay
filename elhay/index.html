<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>El-Hay | الحي</title>
<link rel="stylesheet" href="css/style.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --primary-glow: #ff6b00;
  --bg-glass: rgba(8, 10, 15, 0.75);
  --border-glass: rgba(255, 107, 0, 0.3);
}

body {
  font-family: 'Cairo', sans-serif !important;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #000;
  user-select: none;
  -webkit-user-select: none;
}

/* Canvas اللعبة */
#c {
  width: 100vw;
  height: 100vh;
  display: block;
}

/* القائمة الرئيسية بالخلفية المباشرة */
#menu {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding-right: clamp(20px, 5vw, 60px);
  box-sizing: border-box;
  background: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.6) 100%), 
              url('./bg.png') center/cover no-repeat;
  z-index: 1000;
  pointer-events: auto;
}

/* اللوحة الجانبية */
#menuPanel {
  width: min(340px, 85vw);
  padding: 28px 22px;
  background: var(--bg-glass);
  border: 1px solid var(--border-glass);
  border-radius: 20px;
  box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8), 
              0 0 20px rgba(255, 107, 0, 0.15);
  text-align: center;
  backdrop-filter: blur(10px);
  animation: menuSlideIn 0.4s ease-out forwards;
}

#mTitle {
  font-size: 36px;
  font-weight: 900;
  margin: 0;
  background: linear-gradient(135deg, #ffffff 20%, #ff6b00 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
}

.sub {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #ff9d00;
  margin-bottom: 20px;
  text-transform: uppercase;
}

/* الأزرار العصرية */
.btn-modern, .btn {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #ffffff;
  font-family: 'Cairo', sans-serif;
  font-size: 15px;
  font-weight: 700;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-sizing: border-box;
}

.btn-modern.primary {
  background: linear-gradient(135deg, #ff6b00 0%, #c42b00 100%);
  border: none;
  box-shadow: 0 4px 18px rgba(255, 107, 0, 0.4);
}

.btn-modern:hover {
  transform: translateX(-4px);
  background: rgba(255, 255, 255, 0.15);
  border-color: #ff6b00;
}

.btn-modern.primary:hover {
  background: linear-gradient(135deg, #ff7b1a 0%, #db3000 100%);
  box-shadow: 0 6px 22px rgba(255, 107, 0, 0.6);
}

#menuFoot {
  display: flex;
  gap: 6px;
  margin-top: 15px;
  justify-content: center;
}

.btn-sm, .btn.sm {
  flex: 1;
  padding: 6px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #a0aec0;
  font-family: 'Cairo', sans-serif;
  font-size: 11px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  box-sizing: border-box;
}

.btn-sm:hover, .btn.sm:hover {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
}

/* النوافذ واللوحات */
.panel {
  position: fixed;
  inset: 0;
  z-index: 2000 !important;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  pointer-events: auto;
}

.panel.open {
  display: flex !important;
}

/* ==========================================
   إصلاح الـ OVERLAYS وحل مشكل اللمس والشفافية
   ========================================== */

/* 1. شاشة التحميل والمشاهد السينمائية */
#loading {
  position: fixed;
  inset: 0;
  z-index: 3000;
  pointer-events: auto;
}

#csLayer {
  position: fixed;
  inset: 0;
  z-index: 1500;
  display: none;
  pointer-events: auto;
}

#csLayer.active {
  display: block !important;
}

/* 2. واجهة التاتش للهاتف */
#touchUI {
  position: fixed;
  inset: 0;
  z-index: 500;
  pointer-events: none !important;
}

/* مساحة النظر والجويستيك */
#touchUI #joyBase,
#touchUI #lookArea {
  pointer-events: auto !important;
}

/* جميع أزرار التاتش تكون فوق مساحة النظر */
#touchUI button {
  pointer-events: auto !important;
  z-index: 700 !important;
}

/* زر Sprint */
#touchUI #touchSprint {
  pointer-events: auto !important;
  z-index: 701 !important;
}

/* driveControls يغطي الشاشة كاملة، لذلك لا يحجز اللمس */
#touchUI #driveControls {
  pointer-events: none !important;
  z-index: 500;
}

/* أزرار السيارة فقط عندما تكون ظاهرة */
#touchUI #driveControls.show button {
  pointer-events: auto !important;
  z-index: 701 !important;
}

/* عناصر HUD/UI فوق طبقة التاتش */
#vitalsBox,
#cashBox,
#missionBox,
#minimap,
#invBtn,
#phoneBtn,
#wantedBox,
#weaponHud,
#crosshair,
#reticle,
#prompt {
  pointer-events: auto !important;
}

/* الهاتف والحقيبة والميني ماب فوق touchUI */
#minimap,
#invBtn,
#phoneBtn {
  z-index: 800 !important;
  pointer-events: auto !important;
}

@keyframes menuSlideIn {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}

@media (max-width: 600px) {
  #menu {
    justify-content: center;
    padding-right: 0;
  }
}
/* El-Hay additions */
/* HUD mission box removed: missions live in the map menu */
#missionBox{display:none!important}

/* map menu bar + missions list */
#mapBar{display:flex;gap:8px;margin:8px 0 12px}
#mapBar button{flex:1;padding:10px 6px;font:inherit;font-size:13px;font-weight:700;border-radius:14px;border:1.5px solid var(--border);background:var(--glass-bg);backdrop-filter:blur(10px);color:var(--text);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:transform .15s ease,background .15s ease}
#mapBar button:active{transform:scale(.95);background:rgba(255,107,0,.4)}
#mapBar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#mapMissions{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:10px;max-height:34vh;overflow:auto;text-align:start}
#mapMissions .mi{background:var(--glass-bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:6px}
#mapMissions .mi b{display:block;color:var(--accent);margin-bottom:3px;font-size:14px}
#mapMissions .mi.done{opacity:.5}
#fullMap.detail .card{width:min(96vw,900px)!important}
#pSettings{z-index:60!important}

/* speedometer + radio (only while driving) */
#speedo{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;padding:8px 18px;border-radius:16px;border:1.5px solid var(--border);background:var(--glass-bg);backdrop-filter:blur(10px);color:var(--accent);font:700 20px/1 'Cairo','Segoe UI',system-ui,sans-serif;box-shadow:0 6px 16px rgba(0,0,0,.6);pointer-events:none}
#radioBtn{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));right:270px;z-index:900!important;width:46px;height:46px;border-radius:16px;border:1.5px solid var(--border);background:var(--glass-bg);backdrop-filter:blur(10px);font-size:20px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.6);pointer-events:auto!important}
#radioBtn:active{transform:scale(.9);background:rgba(255,107,0,.4)}
#radioPanel{position:fixed;bottom:84px;right:12px;z-index:900!important;width:min(310px,88vw);padding:12px;border-radius:16px;border:1.5px solid var(--border);background:var(--panel);backdrop-filter:blur(12px);color:var(--text);font-size:13px;pointer-events:auto!important}
#radioPanel b{color:var(--accent)}
#radioPanel input{width:100%;margin:8px 0;padding:9px;border-radius:10px;border:1px solid var(--border);background:rgba(0,0,0,.4);color:#fff;font:inherit;-webkit-user-select:text;user-select:text}
.radioRow{display:flex;gap:6px}
.radioRow button{flex:1;padding:8px 2px;border-radius:10px;border:1px solid var(--border);background:var(--glass-bg);color:#fff;font:inherit;font-size:12px;cursor:pointer}
#radioStatus{margin-top:6px;color:var(--dim)}

/* driving test HUD */
#testHUD{position:fixed;top:max(56px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:900!important;text-align:center;padding:10px 16px;border-radius:16px;border:1.5px solid var(--border);background:var(--glass-bg);backdrop-filter:blur(10px);color:#fff;font-size:13px;max-width:92vw;pointer-events:auto!important}
#testMsg{color:var(--accent);margin-top:4px;min-height:16px}
#testCancel{margin-top:8px;padding:8px 16px;border:0;border-radius:12px;background:#c0392b;color:#fff;font:inherit;font-weight:700;cursor:pointer}

/* weapon bar + extra touch combat buttons */
.whBtn{display:none;margin-left:6px;padding:4px 10px;border-radius:10px;border:1px solid var(--border);background:var(--glass-bg);color:#fff;font:inherit;font-size:11px;cursor:pointer}
#weaponHud{align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;max-width:94vw}
#touchReload,#touchHolster{position:absolute;bottom:250px;width:50px;height:50px;border-radius:50%;background:var(--glass-bg);backdrop-filter:blur(12px);border:1.5px solid var(--border);pointer-events:auto;display:none;font-size:18px;box-shadow:0 6px 20px rgba(0,0,0,.65)}
#touchReload{right:98px}
#touchHolster{right:26px}
#touchReload.show,#touchHolster.show{display:flex;align-items:center;justify-content:center}
#speedo{z-index:850}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crosshair"></div>
<div id="hud"></div>
<div id="prompt"></div>
<div id="loading"><div id="lbTrack"><div id="lbFill"></div></div><div id="lbLabel">جاري التحميل...</div></div>

<!-- الواجهة الرئيسية -->
<div id="menu">
  <div id="menuPanel">
    <h1 id="mTitle">الـحـي</h1>
    <div class="sub" id="mSub">OPEN WORLD GAME</div>

    <select id="selMode" style="display:none;">
      <option value="offline" selected>Offline (Single-Player)</option>
    </select>

    <button class="btn btn-modern primary" id="bNew">
      <span>🎮</span> بدء لعبة جديدة
    </button>
    <button class="btn btn-modern" id="bCont">
      <span>💾</span> استمرار اللعب
    </button>
    <button class="btn btn-modern" id="bSet">
      <span>⚙️</span> الإعدادات
    </button>

    <div id="menuFoot">
      <button class="btn btn-sm sm" id="bSup">الدعم</button>
      <button class="btn btn-sm sm" id="bPriv">الخصوصية</button>
      <button class="btn btn-sm sm" id="bTerm">الشروط</button>
    </div>
  </div>
</div>

<!-- نافذة الإعدادات -->
<div class="panel" id="pSettings"><div class="card">
<h2 id="sTitle">الإعدادات</h2>
<div class="row"><span id="lLang">اللغة</span><select id="selLang"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="zh">中文</option></select></div>
<div class="row"><span id="lQual">الجودة</span><select id="selQual"><option value="low">Low</option><option value="med" selected>Medium</option><option value="high">High</option><option value="ultra">Ultra</option></select></div>
<div class="row"><span id="lFps">حد FPS</span><select id="selFps"><option value="30">30</option><option value="60" selected>60</option><option value="120">120</option><option value="0">Unlimited</option></select></div>
<div class="row"><span id="lShow">عرض FPS</span><input type="checkbox" id="chkFps"></div>
<div class="row"><span id="lCtrl">التحكم</span><select id="selCtrl"><option value="wasd">WASD</option><option value="arrows">Arrows</option></select></div>
<button class="close" id="sClose">إغلاق</button>
</div></div>

<div class="panel" id="pLegal"><div class="card"><h2 id="lgTitle">—</h2><p id="lgBody" style="color:var(--dim);font-size:13px;line-height:1.6">—</p><button class="close" id="lgClose">إغلاق</button></div></div>

<div id="vitalsBox">
 <div class="vbar health"><i id="vHealth"></i></div>
 <div class="vbar energy"><i id="vEnergy"></i></div>
 <div class="vbar hunger"><i id="vHunger"></i></div>
 <div class="vbar thirst"><i id="vThirst"></i></div>
 <div class="vbar hygiene"><i id="vHygiene"></i></div>
</div>
<div id="cashBox">$0</div>
<div id="missionBox"></div>
<div id="testHUD" style="display:none">
 <div id="testInfo"></div>
 <div id="testMsg"></div>
 <button id="testCancel">Cancel Test</button>
</div>
<div id="speedo" style="display:none">0 km/h</div>
<button id="radioBtn" style="display:none">📻</button>
<div id="radioPanel" style="display:none">
 <b>📻 Radio (YouTube)</b>
 <input id="radioUrl" type="text" placeholder="Paste YouTube link..." autocomplete="off">
 <div class="radioRow">
  <button id="radioPlay">▶ Load</button>
  <button id="radioPause">⏸ Pause</button>
  <button id="radioStop">⏹ Stop</button>
  <button id="radioClose">✖</button>
 </div>
 <div id="radioStatus">Radio off</div>
 <div id="radioPlayer"></div>
</div>
<div id="minimap"><canvas id="mmCanvas" width="130" height="130"></canvas></div>

<div class="panel" id="fullMap"><div class="card" id="fullMapCard" style="width:min(600px,92vw)">
 <h2>Map</h2>
 <div id="mapBar">
  <button id="mapBtnSet">⚙ الإعدادات</button>
  <button id="mapBtnView">🗺 الخريطة</button>
  <button id="mapBtnMis" class="on">📋 المهمات</button>
 </div>
 <div id="mapMissions"></div>
 <canvas id="fullMapCanvas" width="560" height="560" style="width:100%;border-radius:8px;display:block"></canvas>
 <button class="close" id="fullMapClose">إغلاق</button>
</div></div>

<button id="invBtn">🎒</button>

<div class="panel" id="pShop"><div class="card">
 <h2 id="shopTitle">—</h2>
 <div id="shopList"></div>
 <button class="close" id="shopClose">إغلاق</button>
</div></div>

<div class="panel" id="pPolice"><div class="card" id="pPoliceCard">
 <h2 id="polTitle">Police Checkpoint</h2>
 <p id="polBody" style="color:var(--dim);font-size:13px"></p>
 <div class="policeBtns">
  <button id="polComply">Surrender</button>
  <button id="polPay">Bribe ($100)</button>
  <button id="polFlee">Escape</button>
 </div>
</div></div>

<div id="csLayer"><div class="lb" id="lbTop"></div><div class="lb" id="lbBot"></div><div id="csSub"></div><div id="csCard"></div><button id="csSkip">تخطي</button></div>

<button id="phoneBtn">📱</button>

<div class="panel" id="pPhone"><div class="card" id="phoneCard">
 <div id="phoneTabs">
  <button class="ptab" data-tab="contacts">Contacts</button>
  <button class="ptab" data-tab="camera">Camera</button>
  <button class="ptab" data-tab="video">Video</button>
  <button class="ptab" data-tab="delivery">Delivery</button>
  <button class="ptab" data-tab="realestate">Market</button>
  <button class="ptab" data-tab="weapons">Weapons</button>
 </div>
 <div id="phoneBody"></div>
 <button class="close" id="phoneClose">إغلاق</button>
</div></div>

<div id="wantedBox">🚨 WANTED</div>

<div id="weaponHud">
 <span id="whName">Fists</span><span id="whAmmo"></span>
 <span id="whMsg" style="margin-left:8px;color:#ffd23a"></span>
 <button id="whFire" class="whBtn">🔥 Fire</button>
 <button id="whReload" class="whBtn">🔃 Reload</button>
 <button id="whHolster" class="whBtn">🫳 Holster</button>
</div>

<div id="reticle"></div>

<!-- MOBILE TOUCH UI -->
<div id="touchUI">
  <div id="lookArea"></div>
  <div id="joyBase"><div id="joyStick"></div></div>
  <button id="touchInteract">E</button>
  <button id="touchSprint">🏃</button>
  <button id="touchFire">🔥</button>
  <button id="touchWeapon">🔄</button>
  <button id="touchReload">🔃</button>
  <button id="touchHolster">🫳</button>

  <div id="driveControls">
    <button id="btnGas">▲</button>
    <button id="btnBrake">▼</button>
    <button id="btnLeft">◀</button>
    <button id="btnRight">▶</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

<!-- OBJ vehicle loader -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

<script src="js/ui.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/cutscenes.js"></script>
<script src="js/systems.js"></script>
<script src="js/missions.js"></script>
<script src="js/npc.js"></script>
<script src="js/weapons.js"></script>
<script src="js/phone.js"></script>
<script src="js/persistence.js"></script>
<script src="js/main.js"></script>

</body>
</html>
