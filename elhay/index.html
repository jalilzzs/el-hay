<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>El-Hay | الحي</title>
<link rel="stylesheet" href="css/style.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
/* =========================================================
   تنسيق القائمة الجانبية المجهزة للصورة الرسمية
   ========================================================= */
:root {
  --primary-glow: #ff6b00;
  --bg-glass: rgba(8, 10, 15, 0.75);
  --border-glass: rgba(255, 107, 0, 0.3);
}

body {
  font-family: 'Cairo', sans-serif !important;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #000;
}

/* القائمة الرئيسية بالخلفية المسحوبة من المسار */
#menu {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  display: flex;
  align-items: center;
  justify-content: flex-start; /* وضع الأزرار في الجانب الأيمن */
  padding-right: clamp(20px, 5vw, 60px);
  box-sizing: border-box;
  background: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.6) 100%), 
              url('indexhtmlpic/bg.jpg') center/cover no-repeat;
  z-index: 1000;
}

/* اللوحة الجانبية الأنيقة */
#menuPanel {
  width: min(340px, 85vw);
  padding: 28px 22px;
  background: var(--bg-glass);
  border: 1px solid var(--border-glass);
  border-radius: 20px;
  box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8), 
              0 0 20px rgba(255, 107, 0, 0.15);
  text-align: center;
  backdrop-filter: blur(10px);
  animation: menuSlideIn 0.4s ease-out forwards;
}

#mTitle {
  font-size: 36px;
  font-weight: 900;
  margin: 0;
  background: linear-gradient(135deg, #ffffff 20%, #ff6b00 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
}

.sub {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #ff9d00;
  margin-bottom: 20px;
  text-transform: uppercase;
}

/* الأزرار العصرية المنسقة */
.btn-modern {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #ffffff;
  font-family: 'Cairo', sans-serif;
  font-size: 15px;
  font-weight: 700;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.btn-modern.primary {
  background: linear-gradient(135deg, #ff6b00 0%, #c42b00 100%);
  border: none;
  box-shadow: 0 4px 18px rgba(255, 107, 0, 0.4);
}

.btn-modern:hover {
  transform: translateX(-4px);
  background: rgba(255, 255, 255, 0.15);
  border-color: #ff6b00;
}

.btn-modern.primary:hover {
  background: linear-gradient(135deg, #ff7b1a 0%, #db3000 100%);
  box-shadow: 0 6px 22px rgba(255, 107, 0, 0.6);
}

#menuFoot {
  display: flex;
  gap: 6px;
  margin-top: 15px;
  justify-content: center;
}

.btn-sm {
  flex: 1;
  padding: 6px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #a0aec0;
  font-family: 'Cairo', sans-serif;
  font-size: 11px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-sm:hover {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
}

/* رفع زدر الترتيب للنوافذ لكي تفتح فوق الواجهة دائماً */
.panel {
  z-index: 2000 !important;
}

@keyframes menuSlideIn {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}

@media (max-width: 600px) {
  #menu {
    justify-content: center;
    padding-right: 0;
  }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crosshair"></div>
<div id="hud"></div>
<div id="prompt"></div>
<div id="loading"><div id="lbTrack"><div id="lbFill"></div></div><div id="lbLabel">جاري تحميل شوارع الحي...</div></div>

<!-- الواجهة الرئيسية -->
<div id="menu">
  <div id="menuPanel">
    <h1 id="mTitle">الـحـي</h1>
    <div class="sub" id="mSub">OPEN WORLD GAME</div>

    <button class="btn-modern primary" id="bNew">
      <span>🎮</span> بدء لعبة جديدة
    </button>
    <button class="btn-modern" id="bCont">
      <span>💾</span> استمرار اللعب
    </button>
    <button class="btn-modern" id="bSet">
      <span>⚙️</span> الإعدادات
    </button>

    <div id="menuFoot">
      <button class="btn-sm" id="bSup">الدعم</button>
      <button class="btn-sm" id="bPriv">الخصوصية</button>
      <button class="btn-sm" id="bTerm">الشروط</button>
    </div>
  </div>
</div>

<!-- نافذة الإعدادات (تفتح الآن فوق كل شيء) -->
<div class="panel" id="pSettings"><div class="card">
<h2 id="sTitle">الإعدادات</h2>
<div class="row"><span id="lLang">اللغة</span><select id="selLang"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="zh">中文</option></select></div>
<div class="row"><span id="lQual">الجودة</span><select id="selQual"><option value="low">Low</option><option value="med" selected>Medium</option><option value="high">High</option><option value="ultra">Ultra</option></select></div>
<div class="row"><span id="lFps">حد FPS</span><select id="selFps"><option value="30">30</option><option value="60" selected>60</option><option value="120">120</option><option value="0">Unlimited</option></select></div>
<div class="row"><span id="lShow">عرض FPS</span><input type="checkbox" id="chkFps"></div>
<div class="row"><span id="lCtrl">التحكم</span><select id="selCtrl"><option value="wasd">WASD</option><option value="arrows">Arrows</option></select></div>
<button class="close" id="sClose">إغلاق</button>
</div></div>

<div class="panel" id="pLegal"><div class="card"><h2 id="lgTitle">—</h2><p id="lgBody" style="color:var(--dim);font-size:13px;line-height:1.6">—</p><button class="close" id="lgClose">إغلاق</button></div></div>

<div id="vitalsBox">
 <div class="vbar health"><i id="vHealth"></i></div>
 <div class="vbar energy"><i id="vEnergy"></i></div>
 <div class="vbar hunger"><i id="vHunger"></i></div>
 <div class="vbar thirst"><i id="vThirst"></i></div>
 <div class="vbar hygiene"><i id="vHygiene"></i></div>
</div>
<div id="cashBox">$0</div>
<div id="missionBox"></div>
<div id="minimap"><canvas id="mmCanvas" width="130" height="130"></canvas></div>
<div class="panel" id="fullMap"><div class="card" style="width:min(600px,92vw)">
 <h2>Map</h2>
 <canvas id="fullMapCanvas" width="560" height="560" style="width:100%;border-radius:8px;display:block"></canvas>
 <button class="close" id="fullMapClose">إغلاق</button>
</div></div>
<button id="invBtn">🎒</button>

<div class="panel" id="pShop"><div class="card">
 <h2 id="shopTitle">—</h2>
 <div id="shopList"></div>
 <button class="close" id="shopClose">إغلاق</button>
</div></div>

<div class="panel" id="pPolice"><div class="card" id="pPoliceCard">
 <h2 id="polTitle">Police Checkpoint</h2>
 <p id="polBody" style="color:var(--dim);font-size:13px"></p>
 <div class="policeBtns">
  <button id="polComply">Surrender</button>
  <button id="polPay">Bribe ($100)</button>
  <button id="polFlee">Escape</button>
 </div>
</div></div>

<div id="csLayer"><div class="lb" id="lbTop"></div><div class="lb" id="lbBot"></div><div id="csSub"></div><div id="csCard"></div><button id="csSkip">تخطي</button></div>

<button id="phoneBtn">📱</button>
<div class="panel" id="pPhone"><div class="card" id="phoneCard">
 <div id="phoneTabs">
  <button class="ptab" data-tab="contacts">Contacts</button>
  <button class="ptab" data-tab="camera">Camera</button>
  <button class="ptab" data-tab="video">Video</button>
  <button class="ptab" data-tab="delivery">Delivery</button>
  <button class="ptab" data-tab="realestate">Market</button>
  <button class="ptab" data-tab="weapons">Weapons</button>
 </div>
 <div id="phoneBody"></div>
 <button class="close" id="phoneClose">إغلاق</button>
</div></div>

<div id="wantedBox">🚨 WANTED</div>
<div id="weaponHud">
 <span id="whName">Fists</span><span id="whAmmo"></span>
</div>
<div id="reticle"></div>

<!-- MOBILE TOUCH UI -->
<div id="touchUI">
  <div id="lookArea"></div>
  <div id="joyBase"><div id="joyStick"></div></div>
  <button id="touchInteract">E</button>
  <button id="touchSprint">🏃</button>
  <button id="touchFire">🔥</button>
  <button id="touchWeapon">🔄</button>
  <div id="driveControls">
    <button id="btnGas">▲</button>
    <button id="btnBrake">▼</button>
    <button id="btnLeft">◀</button>
    <button id="btnRight">▶</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

<script src="js/ui.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/cutscenes.js"></script>
<script src="js/systems.js"></script>
<script src="js/missions.js"></script>
<script src="js/npc.js"></script>
<script src="js/weapons.js"></script>
<script src="js/phone.js"></script>
<script src="js/persistence.js"></script>
<script src="js/main.js"></script>
</body>
</html>
